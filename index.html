<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Logo de Noucolor en la pestaña del navegador -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e6a030" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      (function(){
        try {
          var t = localStorage.getItem('theme');
          var d = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (t === 'dark' || ((!t || t === 'system') && d)) {
            document.documentElement.classList.add('dark');
          }
        } catch(e){ document.documentElement.classList.add('dark'); }
      })();
    </script>
    <title>Noucolor — Gestió Interna</title>
    <meta name="description" content="Aplicación de gestión interna de Noucolor — Pintura i Decoració, Andorra" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
